name: Daily MLB Sharp Cards

# Runs every day around 11:00 AM-12:00 PM America/New_York.
# Cron is in UTC. Scheduled at minute 47 (off-peak) to minimize GitHub's
# top-of-hour delivery delay; in practice the run starts ~11:15-12:15 PM ET.
#
# GitHub silently SKIPS scheduled runs under load, so each primary cron has a
# backup ~90 min later. The `precheck` job makes the backup a no-op when the
# primary already produced today's cards (guards against double-posting to
# Discord / the record channel), so the backup only does real work on a skip.
on:
  # Multiple staggered attempts. GitHub cron is best-effort and has no timezone,
  # so every entry below fires year-round (UTC-4 in EDT, UTC-5 in EST) — they are
  # just independent retries. precheck makes every attempt after the first a free
  # no-op, so more attempts only RAISE the odds of at least one firing before
  # game time; they never double-post.
  schedule:
    - cron: "47 14 * * *"   # 10:47 ET (EDT) / 09:47 ET (EST) — primary
    - cron: "47 15 * * *"   # 11:47 ET (EDT) / 10:47 ET (EST) — primary
    - cron: "32 15 * * *"   # 11:32 ET (EDT) / 10:32 ET (EST) — retry
    - cron: "32 16 * * *"   # 12:32 ET (EDT) / 11:32 ET (EST) — retry
    - cron: "17 16 * * *"   # 12:17 ET (EDT) / 11:17 ET (EST) — backup
    - cron: "17 17 * * *"   # 13:17 ET (EDT) / 12:17 ET (EST) — backup
  workflow_dispatch:        # allow manual run from the Actions tab

permissions:
  contents: write           # so we can commit the daily output back

# Serialize runs: a backup cron (or a manual dispatch) that overlaps an
# in-flight run waits for it to finish instead of racing on `git push`
# (the cause of past non-fast-forward failures). The queued run then sees
# the committed cards via `precheck` and skips.
concurrency:
  group: daily-mlb-sharp
  cancel-in-progress: false

jobs:
  # Cheap gate: has today's slate already been produced and committed by an
  # earlier run? If so, the backup run skips everything below. This checkout
  # never scrapes, so cards.md exists here ONLY if a prior run committed it.
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: America/New_York
    outputs:
      done: ${{ steps.guard.outputs.done }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Determine target date (US/Eastern)
        id: date
        run: echo "value=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Skip if today's cards already exist
        id: guard
        run: |
          if [ -f "mlb_data/${{ steps.date.outputs.value }}/cards.md" ]; then
            echo "Today's cards already committed by an earlier run — skipping."
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "No cards yet for today — proceeding with full run."
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-send:
    needs: precheck
    if: ${{ needs.precheck.outputs.done != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      ODDS_API_KEY:                ${{ secrets.ODDS_API_KEY }}
      ODDS_API_KEY_2:              ${{ secrets.ODDS_API_KEY_2 }}
      ODDS_API_KEY_3:              ${{ secrets.ODDS_API_KEY_3 }}
      SLACK_WEBHOOK_URL:           ${{ secrets.SLACK_WEBHOOK_URL }}
      DISCORD_WEBHOOK_URL:         ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_RECORD_WEBHOOK_URL:  ${{ secrets.DISCORD_RECORD_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN:          ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:            ${{ secrets.TELEGRAM_CHAT_ID }}
      EMAIL_SMTP_HOST:             ${{ secrets.EMAIL_SMTP_HOST }}
      EMAIL_SMTP_PORT:             ${{ secrets.EMAIL_SMTP_PORT }}
      EMAIL_SMTP_USER:             ${{ secrets.EMAIL_SMTP_USER }}
      EMAIL_SMTP_PASS:             ${{ secrets.EMAIL_SMTP_PASS }}
      EMAIL_TO:                    ${{ secrets.EMAIL_TO }}
      TZ:                          America/New_York

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine target date (US/Eastern)
        id: date
        run: echo "value=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Configure git identity
        run: |
          git config user.name  "mlb-sharp-bot"
          git config user.email "mlb-sharp-bot@users.noreply.github.com"

      - name: Settle yesterday's pending bets
        run: python bet_tracker.py settle --data-root ./mlb_data
        continue-on-error: true

      - name: Settle yesterday's paper prop bets
        run: python bet_tracker.py settle-paper-props --data-root ./mlb_data
        continue-on-error: true

      - name: Scrape MLB data
        run: python mlb_data_scraper.py --date ${{ steps.date.outputs.value }} --out ./mlb_data

      - name: Grade games and build cards
        run: python mlb_grader.py --date ${{ steps.date.outputs.value }} --data-root ./mlb_data

      # --- User-facing output first: post to Discord the moment cards exist,
      #     before the non-critical reporting/sim/dashboard steps run. notify.py
      #     reads only the graded cards + settled paper P/L, so this is safe. ---
      - name: Send cards to configured destinations
        run: python notify.py --date ${{ steps.date.outputs.value }} --data-root ./mlb_data
        continue-on-error: true   # don't fail the workflow if a webhook is down

      - name: Append today's cards to bet log
        run: python bet_tracker.py append --date ${{ steps.date.outputs.value }} --data-root ./mlb_data

      - name: Rebuild record.md
        run: python bet_tracker.py report --data-root ./mlb_data

      - name: Rebuild paper-props P/L report
        run: python bet_tracker.py paper-report --window-days 7 --data-root ./mlb_data
        continue-on-error: true

      # build_site reads bet_log.csv / prop_paper_log.csv (updated above) but
      # NOT the bankroll sim or dashboard, so it runs here — right after the
      # record is fresh and before the non-critical steps.
      - name: Rebuild public site (docs/ for GitHub Pages)
        run: python build_site.py --data-root ./mlb_data --out ./docs
        continue-on-error: true   # site is nice-to-have

      # Push docs/ immediately so GitHub Pages starts rebuilding now instead of
      # waiting on the sim/dashboard/record steps below.
      - name: Deploy site (commit docs/ early)
        run: |
          git add docs/
          if git diff --staged --quiet; then
            echo "No site changes to commit"
          else
            git commit -m "site: prop boards + record ${{ steps.date.outputs.value }}"
            # Pull-rebase + retry: closing-snapshot (hourly) and pregame-alerts
            # (every 15 min) commit to this same repo, so a bare push can hit a
            # non-fast-forward and fail. Rebase onto their commits and retry.
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break || sleep $((i*5))
            done
          fi

      - name: Rebuild bankroll simulation
        run: python bankroll_sim.py --data-root ./mlb_data
        continue-on-error: true   # sim is non-critical

      - name: Build HTML dashboard
        run: python build_dashboard.py --date ${{ steps.date.outputs.value }} --data-root ./mlb_data
        continue-on-error: true   # dashboard is nice-to-have

      - name: Post bet record to dedicated channel
        run: python post_record.py --data-root ./mlb_data
        continue-on-error: true

      - name: Commit remaining daily artifacts back to repo
        run: |
          git add mlb_data/${{ steps.date.outputs.value }}/ \
                  mlb_data/bet_log.csv mlb_data/record.md mlb_data/bankroll_sim.md \
                  mlb_data/dashboard.html \
                  mlb_data/prop_paper_log.csv mlb_data/prop_paper_record.md \
                  docs/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "daily cards + record ${{ steps.date.outputs.value }}"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break || sleep $((i*5))
            done
          fi

      - name: Upload cards.md as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-cards-${{ steps.date.outputs.value }}
          path: mlb_data/${{ steps.date.outputs.value }}/
          if-no-files-found: warn
